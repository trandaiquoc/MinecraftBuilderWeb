<section class="quick-block-bar" [class.collapsed]="quick.collapsed()" [attr.aria-label]="i18n.t('quickBlockBar')">
  <button type="button" class="collapse" [attr.title]="quick.collapsed() ? i18n.t('expand') : i18n.t('collapse')" (click)="quick.collapsed.set(!quick.collapsed())">{{ quick.collapsed() ? '+' : '−' }}</button>
  @if (!quick.collapsed()) { <div class="slots">@for (entry of entries(); track entry.key; let index = $index) { <button type="button" class="slot" [class.active]="entry.active" (click)="quick.select(entry)" [attr.title]="entry.displayName + ' · ' + entry.id"><span>@if (entry.thumbnail) { <img [src]="entry.thumbnail" alt="" /> } @else { ◇ }</span><small>{{ index + 1 }}</small><em (click)="$event.stopPropagation(); quick.remove(index)" role="button" tabindex="0" [attr.aria-label]="i18n.t('remove')">×</em></button> } @empty { <small class="empty">{{ i18n.t('addActiveBlockHint') }}</small> }</div> }
</section>
