<section class="decoration-browser">
  <header class="decoration-browser-header">
    <h3>{{ i18n.t('decorationsPanel') }}</h3>
  </header>
  <app-content-source-selector [sources]="sources()" [selectedId]="selectedSource()" [label]="i18n.t('contentSource')" [manageLabel]="i18n.t('manageSources')" (selectionChange)="selectSource($event)" (manageRequested)="openAssetManager()" />
  @if (selectedSource() === 'minecraft' || selectedSource() === 'vanilla') { <div class="decoration-choice-list">
    <button type="button" class="decoration-card" [class.active]="decorations.active()?.kind === 'painting'" [attr.aria-pressed]="decorations.active()?.kind === 'painting'" (click)="decorations.selectPainting()">
      <span class="decoration-card-preview painting-preview"><img [src]="paintingTexture()" [alt]="i18n.t('painting')" /></span>
      <span class="decoration-card-copy"><strong>{{ i18n.t('painting') }}</strong><small>{{ paintingCaption() }}</small></span>
    </button>
    <button type="button" class="decoration-card" [class.active]="decorations.active()?.kind === 'item-frame'" [attr.aria-pressed]="decorations.active()?.kind === 'item-frame'" (click)="decorations.selectFrame(false)">
      <span class="decoration-card-preview"><img [src]="frameTexture(false)" [alt]="i18n.t('itemFrame')" /></span>
      <span class="decoration-card-copy"><strong>{{ i18n.t('itemFrame') }}</strong><small>{{ i18n.t('normalFrame') }}</small></span>
    </button>
    <button type="button" class="decoration-card" [class.active]="decorations.active()?.kind === 'glow-item-frame'" [attr.aria-pressed]="decorations.active()?.kind === 'glow-item-frame'" (click)="decorations.selectFrame(true)">
      <span class="decoration-card-preview glow-preview"><img [src]="frameTexture(true)" [alt]="i18n.t('glowItemFrame')" /></span>
      <span class="decoration-card-copy"><strong>{{ i18n.t('glowItemFrame') }}</strong><small>{{ i18n.t('glowFrameShort') }}</small></span>
    </button>
  </div> }
  @if ((selectedSource() === 'minecraft' || selectedSource() === 'vanilla') && decorations.active()?.kind === 'painting') {
    <app-painting-picker [selectedId]="decorations.active()?.variantId ?? ''" (selectionChange)="decorations.selectPainting($event)" />
  }
</section>
