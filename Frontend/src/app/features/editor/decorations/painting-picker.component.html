@if (compact()) {
  <button
    type="button"
    class="change-painting ui-button ui-button--secondary ui-button--sm"
    (click)="toggle()"
  >
    {{ i18n.t('changePainting') }}
  </button>
  @if (open()) {
    <div class="picker-panel">
      <div class="picker-search">
        <input
          type="search"
          [value]="query()"
          [placeholder]="i18n.t('searchPaintings')"
          [attr.aria-label]="i18n.t('searchPaintings')"
          (input)="updateQuery($event)"
        />
      </div>
      <div class="painting-grid" role="group" [attr.aria-label]="i18n.t('paintingVariants')">
        @for (variant of filteredVariants(); track variant.id) {
          <button
            type="button"
            class="painting-card"
            [class.selected]="variant.id === selectedId()"
            [attr.aria-pressed]="variant.id === selectedId()"
            (click)="choose(variant.id)"
          >
            <span class="painting-image"
              ><img
                [src]="imageUrl(variant)"
                [alt]="label(variant.id)"
                [style.width.px]="imageSize(variant).width"
                [style.height.px]="imageSize(variant).height"
                loading="lazy"
            /></span>
            @if (variant.id === selectedId()) {
              <span
                class="painting-selected-indicator workspace-selection-indicator"
                aria-hidden="true"
                ><svg lucideCheck></svg
              ></span>
            }
            <span class="painting-card-meta"
              ><strong [attr.title]="label(variant.id)">{{ label(variant.id) }}</strong
              ><small>{{ variant.width }} &times; {{ variant.height }}</small></span
            >
          </button>
        } @empty {
          <p class="painting-empty-state">{{ i18n.t('noPaintingMatches') }}</p>
        }
      </div>
    </div>
  }
} @else {
  <label class="picker-search"
    ><span>{{ i18n.t('paintingVariants') }}</span
    ><input
      type="search"
      [value]="query()"
      [placeholder]="i18n.t('searchPaintings')"
      [attr.aria-label]="i18n.t('searchPaintings')"
      (input)="updateQuery($event)"
  /></label>
  <div class="painting-grid" role="group" [attr.aria-label]="i18n.t('paintingVariants')">
    @for (variant of filteredVariants(); track variant.id) {
      <button
        type="button"
        class="painting-card"
        [class.selected]="variant.id === selectedId()"
        [attr.aria-pressed]="variant.id === selectedId()"
        (click)="choose(variant.id)"
      >
        <span class="painting-image"
          ><img
            [src]="imageUrl(variant)"
            [alt]="label(variant.id)"
            [style.width.px]="imageSize(variant).width"
            [style.height.px]="imageSize(variant).height"
            loading="lazy"
        /></span>
        @if (variant.id === selectedId()) {
          <span class="painting-selected-indicator workspace-selection-indicator" aria-hidden="true"
            ><svg lucideCheck></svg
          ></span>
        }
        <span class="painting-card-meta"
          ><strong [attr.title]="label(variant.id)">{{ label(variant.id) }}</strong
          ><small>{{ variant.width }} &times; {{ variant.height }}</small></span
        >
      </button>
    } @empty {
      <p class="painting-empty-state">{{ i18n.t('noPaintingMatches') }}</p>
    }
  </div>
}
