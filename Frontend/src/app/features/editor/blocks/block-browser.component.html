<section class="block-browser">
  <app-content-source-selector
    [sources]="sources()"
    [selectedId]="activeSource()"
    [label]="i18n.t('contentSource')"
    [manageLabel]="i18n.t('manageSources')"
    (selectionChange)="selectSource($event)"
    (manageRequested)="openAssetManager()"
  />
  <div class="search-field">
    <label class="search-label" for="block-search">{{ i18n.t('blockSearch') }}</label
    ><input
      #searchInput
      id="block-search"
      type="search"
      [value]="library.query()"
      (input)="search($event)"
      [placeholder]="i18n.t('blockSearchPlaceholder')"
    />
  </div>
  @if (assetsUnavailable()) {
    <div class="asset-empty-state">
      <p role="alert">{{ assets.message() || i18n.t('assetsUnavailableForBrowser') }}</p>
      <button
        type="button"
        class="ui-button ui-button--secondary ui-button--sm"
        (click)="retryAssets()"
      >
        {{ i18n.t('retry') }}</button
      ><button
        type="button"
        class="ui-button ui-button--primary ui-button--sm"
        (click)="openAssetManager()"
      >
        {{ i18n.t('openAssetManager') }}
      </button>
    </div>
  } @else if (results().length) {
    <div #catalogGridHost class="catalog-grid-host" [class.compact]="isCompact()">
      <cdk-virtual-scroll-viewport
        #catalogViewport
        class="results"
        [itemSize]="rowHeight()"
        role="group"
        [style.--block-columns]="columnCount()"
        [style.--block-row-height.px]="rowHeight()"
        [attr.aria-label]="i18n.t('blocksPanel')"
      >
        <div *cdkVirtualFor="let row of rows(); trackBy: trackRow" class="block-row">
          @for (block of row; track block.itemId) {
            <div
              class="block-item"
              thumbnailVisibility
              [thumbnailVisibilityEpoch]="assets.thumbnailEpoch()"
              [class.active]="isActive(block)"
              (thumbnailVisible)="requestThumbnail(block, $event)"
            >
              <button
                type="button"
                class="block-select-action"
                (click)="select(block)"
                [attr.aria-pressed]="isActive(block)"
                [attr.aria-label]="block.displayName + ', ' + block.displayBlockId"
              >
                <span
                  class="preview"
                  [class.has-thumbnail]="!!assets.thumbnailUrlForItem(block)"
                  [class.fallback]="block.visualSupport === 'fallback'"
                >
                  @if (assets.thumbnailUrlForItem(block); as thumbnail) {
                    <img [src]="thumbnail" alt="" />
                  } @else {
                    <span>{{ block.visualSupport === 'fallback' ? '?' : '◇' }}</span>
                  }</span
                ><span class="block-copy"
                  ><strong>{{ block.displayName }}</strong
                  ><small class="block-copy-id" [attr.title]="block.displayBlockId">{{
                    block.displayBlockId
                  }}</small></span
                >
                @if (isActive(block)) {
                  <span
                    class="block-selected-indicator workspace-selection-indicator"
                    aria-hidden="true"
                    ><svg lucideCheck></svg
                  ></span>
                }
              </button>
              <span class="quick-add-wrapper"
                ><button
                  type="button"
                  class="quick-add-action"
                  [class.ui-tooltip-align-end]="isCompact()"
                  uiTooltip="{{ quickAddLabel(block) }}"
                  (click)="addToQuickBar($event, block)"
                  [disabled]="!canAddToQuickBar(block)"
                  [attr.aria-label]="quickAddLabel(block)"
                >
                  <svg lucidePlus aria-hidden="true"></svg></button
              ></span>
            </div>
          }
        </div>
      </cdk-virtual-scroll-viewport>
    </div>
  } @else {
    <div class="block-empty-state" role="status">
      <p>{{ i18n.t('noBlockResults') }}</p>
      @if (library.query().trim()) {
        <button
          type="button"
          class="ui-button ui-button--secondary ui-button--sm"
          (click)="clearSearch()"
        >
          {{ i18n.t('clearSearch') }}
        </button>
      }
    </div>
  }
</section>
