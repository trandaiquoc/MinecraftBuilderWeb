<div class="layer-editor">
  <div class="layer-controls">
    <div class="layer-control-group"><button type="button" uiTooltip="{{ i18n.t('previousLayer') }}" (click)="stepLayer(-1)" [attr.aria-label]="i18n.t('previousLayer')"><svg lucideChevronLeft aria-hidden="true"></svg></button><label>{{ i18n.t('currentLayer') }} <input type="number" min="0" [value]="currentY()" (input)="setLayer($any($event.target).value)" /></label><button type="button" uiTooltip="{{ i18n.t('nextLayer') }}" (click)="stepLayer(1)" [attr.aria-label]="i18n.t('nextLayer')"><svg lucideChevronRight aria-hidden="true"></svg></button><input class="layer-slider" type="range" min="0" [max]="(workspace.project()?.size?.y ?? 1) - 1" [value]="currentY()" (input)="setLayer($any($event.target).value)" [attr.aria-label]="i18n.t('currentLayer')" /></div>
    <div class="layer-control-group"><button type="button" (click)="jumpLayer('first')">{{ i18n.t('firstOccupied') }}</button><button type="button" (click)="jumpAdjacent(-1)">{{ i18n.t('previousOccupied') }}</button><button type="button" (click)="jumpAdjacent(1)">{{ i18n.t('nextOccupied') }}</button><button type="button" (click)="jumpLayer('last')">{{ i18n.t('lastOccupied') }}</button></div>
    <div class="layer-control-group layer-display-controls"><app-themed-select [options]="visibilityOptions()" [selectedId]="visibility()" [ariaLabel]="i18n.t('visibility')" (selectionChange)="setVisibility($any($event))" /><label>{{ i18n.t('referenceOpacity') }} <input type="range" min="0" max="1" step="0.05" [value]="workspace.project()?.editorSettings?.referenceLayerOpacity ?? .28" (input)="setOpacity($any($event.target).value)" [attr.aria-label]="i18n.t('referenceOpacity')" /><output>{{ referenceOpacityPercent() }}%</output></label></div>
  </div>
  <div #host class="layer-viewport" (pointermove)="pointerMove($event)" (pointerdown)="pointerDown($event)" (pointerup)="pointerUp($event)" (pointercancel)="cancelPointer($event)" (lostpointercapture)="cancelPointer($event)" (pointerleave)="pointerLeave($event)" (wheel)="preventViewportWheel($event)" (contextmenu)="$event.preventDefault()" (window:resize)="resize()">
    @if (target() || reasonLabel() || status() !== 'invalid') { <div class="viewport-status" [attr.data-status]="status()">{{ statusLabel() }} @if (reasonLabel()) { <span>&middot; {{ reasonLabel() }}</span> } @if (target()) { <span>{{ target() }}</span> }</div> }
  </div>
</div>
