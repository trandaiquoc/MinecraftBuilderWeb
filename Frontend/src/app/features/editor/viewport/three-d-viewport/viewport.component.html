<div
  #host
  class="viewport-host"
  (pointerdown)="pointerDown($event)"
  (pointerup)="pointerUp($event)"
  (pointercancel)="cancelPointer($event)"
  (lostpointercapture)="cancelPointer($event)"
  (pointerleave)="pointerLeave($event)"
  (wheel)="preventViewportWheel($event)"
  (contextmenu)="$event.preventDefault()"
  (window:resize)="resize()"
>
  <div #selectionMarquee class="selection-marquee" aria-hidden="true" hidden></div>
  <app-viewport-overlay-stack
    [project]="workspace.project()"
    [tool]="tool.active()"
    [hasActiveBlock]="!!active.active()"
    [hasActiveDecoration]="!!decorations.active()"
    [placementStatus]="placementFeedback()?.status"
    [placementReason]="reasonLabel()"
    [target]="target()"
  />
</div>
