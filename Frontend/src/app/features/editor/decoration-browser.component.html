<section class="decoration-browser" [class.expanded]="expanded()">
  <div class="browser-heading"><strong>{{ i18n.t('decorationsPanel') }}</strong><button type="button" (click)="toggleExpanded()" [attr.aria-expanded]="expanded()">{{ expanded() ? i18n.t('collapse') : i18n.t('expand') }}</button></div>
  <div class="decoration-choice-row">
    <button type="button" [class.active]="decorations.active()?.kind === 'painting'" (click)="decorations.selectPainting()">{{ i18n.t('painting') }}</button>
    <button type="button" [class.active]="decorations.active()?.kind === 'item-frame'" (click)="decorations.selectFrame(false)">{{ i18n.t('itemFrame') }}</button>
    <button type="button" [class.active]="decorations.active()?.kind === 'glow-item-frame'" (click)="decorations.selectFrame(true)">{{ i18n.t('glowItemFrame') }}</button>
  </div>
  @if (decorations.active()?.kind === 'painting') {
    <label class="search-label">{{ i18n.t('paintingVariants') }}<app-searchable-dropdown [options]="variantOptions" [selectedId]="decorations.active()?.variantId ?? ''" [placeholder]="i18n.t('searchPaintings')" [ariaLabel]="i18n.t('paintingVariants')" [closeLabel]="i18n.t('cancel')" [noResults]="i18n.t('noMatches')" (selectionChange)="decorations.selectPainting($event)" /></label>
  }
  @if (decorations.active(); as active) { <p class="active-decoration">{{ i18n.t('activeDecoration') }}: <strong>{{ active.variantId || (active.kind === 'glow-item-frame' ? i18n.t('glowItemFrame') : i18n.t('itemFrame')) }}</strong></p> }
</section>
