@if (selected()) {
  <section class="sign-inspector">
    <h3>{{ i18n.t('signText') }}</h3>
    <div class="sign-side">
      <span>{{ sideLabel() }}</span>
      <button type="button" (click)="toggleSide()">{{ i18n.t('editOtherSignSide') }}</button>
    </div>
    <textarea rows="4" [value]="text()" (focus)="beginEdit()" (input)="updateDraft($event)" (blur)="commit()" [attr.aria-label]="i18n.t('signTextInput')"></textarea>
    @if (warning(); as warning) { <small class="warning">{{ warning }}</small> }
    <details [open]="advanced()" (toggle)="advanced.set($any($event.target).open)">
      <summary>{{ i18n.t('signAdvanced') }}</summary>
      <p>Color: {{ data()[side()].color }} · {{ data()[side()].glowing ? 'Glowing' : 'Normal' }} · {{ data().waxed ? 'Waxed' : 'Editable' }}</p>
    </details>
  </section>
}
