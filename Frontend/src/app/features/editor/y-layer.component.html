<div class="layer-editor">
  <div class="layer-controls">
    <div class="layer-control-group"><button type="button" (click)="stepLayer(-1)" [attr.aria-label]="i18n.t('previousLayer')">&lsaquo;</button><label>{{ i18n.t('currentLayer') }} <input type="number" min="0" [value]="currentY()" (input)="setLayer($any($event.target).value)" /></label><button type="button" (click)="stepLayer(1)" [attr.aria-label]="i18n.t('nextLayer')">&rsaquo;</button><input class="layer-slider" type="range" min="0" [max]="(workspace.project()?.size?.y ?? 1) - 1" [value]="currentY()" (input)="setLayer($any($event.target).value)" [attr.aria-label]="i18n.t('currentLayer')" /></div>
    <div class="layer-control-group"><button type="button" (click)="jumpLayer('first')">{{ i18n.t('firstOccupied') }}</button><button type="button" (click)="jumpAdjacent(-1)">{{ i18n.t('previousOccupied') }}</button><button type="button" (click)="jumpAdjacent(1)">{{ i18n.t('nextOccupied') }}</button><button type="button" (click)="jumpLayer('last')">{{ i18n.t('lastOccupied') }}</button></div>
    <div class="layer-control-group layer-display-controls"><select [value]="visibility()" (change)="setVisibility($any($event.target).value)" [attr.aria-label]="i18n.t('visibility')"><option value="current-only">{{ i18n.t('visibilityCurrent') }}</option><option value="current-previous">{{ i18n.t('visibilityPrevious') }}</option><option value="current-next">{{ i18n.t('visibilityNext') }}</option><option value="previous-current-next">{{ i18n.t('visibilityThree') }}</option><option value="all-below">{{ i18n.t('visibilityBelow') }}</option><option value="whole-structure">{{ i18n.t('visibilityWhole') }}</option></select><label>{{ i18n.t('referenceOpacity') }} <input type="range" min="0" max="1" step="0.05" [value]="workspace.project()?.editorSettings?.referenceLayerOpacity ?? .28" (input)="setOpacity($any($event.target).value)" [attr.aria-label]="i18n.t('referenceOpacity')" /><output>{{ referenceOpacityPercent() }}%</output></label></div>
  </div>
  <div #host class="layer-viewport" (pointermove)="pointerMove($event)" (pointerdown)="pointerDown($event)" (pointerup)="pointerUp($event)" (pointercancel)="cancelPointer()" (lostpointercapture)="cancelPointer()" (pointerleave)="pointerLeave()" (wheel)="preventViewportWheel($event)" (contextmenu)="$event.preventDefault()" (window:resize)="resize()"><div class="viewport-status" [attr.data-status]="status()">{{ statusLabel() }} @if (target()) { <span>{{ target() }}</span> }</div></div>
</div>
