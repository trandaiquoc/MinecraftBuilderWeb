@if (sourceOptions().length) { <app-content-source-selector [sources]="sourceOptions()" [selectedId]="sourceFilter()" [label]="sourceLabel" [manageLabel]="''" (selectionChange)="selectSource($event)" /> }
<app-searchable-dropdown
  [options]="options()"
  [selectedId]="selectedStack?.id ?? ''"
  [placeholder]="placeholder"
  [emptyLabel]="emptyLabel"
  [ariaLabel]="ariaLabel"
  [closeLabel]="closeLabel"
  [noResults]="noResults"
  (selectionChange)="choose($event)"
  (visibleOptionIds)="loadVisible($event)" />
