<div class="content-source-selector" role="group" [attr.aria-label]="label()">
  <button type="button" class="source-scroll source-scroll--left" [disabled]="!canScrollLeft()" [attr.aria-label]="i18n.t('previousSource')" (click)="scrollSources('left')"><svg lucideChevronLeft aria-hidden="true"></svg></button>
  <div #sourceOptions class="source-options" role="listbox" [attr.aria-label]="label()" (scroll)="updateScrollState()" (wheel)="onSourceWheel($event)" (focusin)="onSourceFocus($event)">
    @for (source of sources(); track source.id) {
      <button type="button" class="source-option" [class.selected]="selectedId() === source.id" [attr.aria-selected]="selectedId() === source.id" [attr.data-source-id]="source.id" [attr.title]="source.tooltip || source.label" (click)="selectionChange.emit(source.id)">
        <span>{{ source.label }}</span>@if (source.count !== undefined) { <small>{{ source.count }}</small> }
      </button>
    }
  </div>
  <button type="button" class="source-scroll source-scroll--right" [disabled]="!canScrollRight()" [attr.aria-label]="i18n.t('nextSource')" (click)="scrollSources('right')"><svg lucideChevronRight aria-hidden="true"></svg></button>
  @if (manageLabel()) { <button type="button" class="source-manage" uiTooltip="{{ manageLabel() }}" [attr.aria-label]="manageLabel()" (click)="manageRequested.emit()"><svg lucidePlus aria-hidden="true"></svg></button> }
</div>
